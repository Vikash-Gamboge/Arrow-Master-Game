name: Build Android APK & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify generated APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk not found!"
            ls -la android/app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "APK generated successfully at android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          mkdir -p /tmp/apk_release
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apk_release/app-debug.apk
          echo "release_asset=/tmp/apk_release/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          gh release create "$TAG_NAME" \
            "${{ steps.prep_asset.outputs.release_asset }}" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Debug APK build generated by GitHub Actions.
            Run Number: ${{ github.run_number }}
            Run Attempt: ${{ github.run_attempt }}
            Commit: ${{ github.sha }}
            
            Intended for testing only." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "### 📱 DIRECT APK DOWNLOAD READY" >> $GITHUB_STEP_SUMMARY
            echo "Direct Download Link:" >> $GITHUB_STEP_SUMMARY
            echo "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Backup Actions Artifact: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Release Publishing Warning" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK artifact \`app-debug-apk\` was successfully built and uploaded." >> $GITHUB_STEP_SUMMARY
          fi
