<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Navy Blue -->
    <linearGradient id="bgNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Bright Blue Arrow Gradient -->
    <linearGradient id="brightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Vibrant Red Accent Gradient -->
    <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgNavyGrad)" />

  <!-- Grid Dot Pattern -->
  <g fill="#38bdf8" opacity="0.18">
    <circle cx="156" cy="156" r="6" />
    <circle cx="256" cy="156" r="6" />
    <circle cx="356" cy="156" r="6" />
    <circle cx="156" cy="256" r="6" />
    <circle cx="256" cy="256" r="6" />
    <circle cx="356" cy="256" r="6" />
    <circle cx="156" cy="356" r="6" />
    <circle cx="256" cy="356" r="6" />
    <circle cx="356" cy="356" r="6" />
  </g>

  <!-- Interlocking Modern Winding Arrows (Navy Blue, Bright Blue, Vibrant Red) -->
  <g filter="url(#softShadow)">
    <!-- 1. Deep Navy / Dark Blue Loop Arrow -->
    <path d="M 140 370 L 140 230 L 310 230 L 310 140 L 370 140"
          fill="none"
          stroke="#1d4ed8"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.9" />
    <polygon points="360,110 420,140 360,170" fill="#1d4ed8" />

    <!-- 2. Bright Blue L-Turn Arrow -->
    <path d="M 140 140 L 230 140 L 230 350 L 360 350"
          fill="none"
          stroke="url(#brightBlueGrad)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <polygon points="350,320 410,350 350,380" fill="url(#brightBlueGrad)" />

    <!-- 3. Red Hero Ascending Arrow -->
    <path d="M 170 370 L 170 180 L 280 180 L 280 120"
          fill="none"
          stroke="url(#redAccentGrad)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <polygon points="250,130 280,70 310,130" fill="url(#redAccentGrad)" />
  </g>

  <!-- Title Text Badge: ARROW MASTER -->
  <g transform="translate(256, 440)" filter="url(#softShadow)">
    <rect x="-140" y="-24" width="280" height="44" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.95" />
    <text x="0" y="6"
          text-anchor="middle"
          fill="#ffffff"
          font-family="system-ui, -apple-system, sans-serif"
          font-weight="900"
          font-size="20"
          letter-spacing="2">ARROW MASTER</text>
  </g>
</svg>
